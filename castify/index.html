<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Castify</title>

<style>
body {
    background: #121212;
    color: white;
    font-family: sans-serif;
    padding: 40px;
}

.rail {
    display: flex;
    gap: 15px;
    overflow-x: auto;
    padding: 10px 0;
}

.netflix-card {
    min-width: 280px;
}

/* ------------------ */
/* PROGRESS RING */
/* ------------------ */
.progress-ring {
    width: 46px;
    height: 46px;
    position: absolute;
    top: 8px;
    right: 8px;
}

circle {
    fill: none;
    stroke-width: 4;
    transform: rotate(-90deg);
    transform-origin: center;
}

.bg {
    stroke: #333;
}

.bar {
    stroke: #00ff88;
    stroke-dasharray: 126;
    stroke-dashoffset: 126;
    transition: 0.4s ease;
}

/* ------------------ */
/* MODAL */
/* ------------------ */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #1f1f1f;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
}

select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
    background: #2a2a2a;
    color: white;
}

.status {
    font-size: 11px;
    color: gray;
    margin-top: 6px;
}
</style>
</head>

<body>

<h1>Castify AI Studio</h1>
<p>Upload PDF → Generate Episodes → Full AI Pipeline</p>

<input type="file" id="pdfFile">
<button onclick="startPipeline()">Generate Script</button>

<div id="status" style="margin-top:20px;color:orange;"></div>

<pre id="output"></pre>

<div id="episode-rail" class="rail"></div>

<!-- VOICE MODAL -->
<div class="modal" id="voiceModal">
  <div class="modal-content">
    <h3>Select Voice</h3>
    <select id="voiceSelect">
        <option value="Idera">Idera</option>
        <option value="Emma">Emma</option>
        <option value="Zainab">Zainab</option>
        <option value="Osagie">Osagie</option>
        <option value="Wura">Wura</option>
        <option value="Jude">Jude</option>
        <option value="Chinenye">Chinenye</option>
    </select>
    <button onclick="confirmVoice()">Continue</button>
  </div>
</div>

<!-- AVATAR MODAL -->
<div class="modal" id="avatarModal">
  <div class="modal-content">
    <h3>Select Avatar</h3>
    <input type="text" id="avatarUrl" placeholder="Paste image URL">
    <button onclick="confirmAvatar()">Generate Video</button>
  </div>
</div>

<script>

let currentSeries;
let currentEpisode;
let pipelineState = {};
let audioStore = {};
let selectedVoice = "";
let selectedAvatar = "";

/* -----------------------
PIPELINE START
----------------------- */
async function startPipeline() {
    const file = document.getElementById('pdfFile').files[0];
    const status = document.getElementById('status');

    if (!file) return alert("Select PDF");

    status.innerText = "Processing PDF...";

    const form = new FormData();
    form.append('pdf', file);

    const res = await fetch('/process-pdf', {
        method: 'POST',
        body: form
    });

    const data = await res.json();

    if (data.error) {
        status.innerText = data.error;
        return;
    }

    currentSeries = data;

    document.getElementById('output').innerText =
        JSON.stringify(data, null, 2);

    renderEpisodes(data);

    status.innerText = "Episodes ready";
}

/* -----------------------
RENDER
----------------------- */
function renderEpisodes(data) {
    const rail = document.getElementById('episode-rail');
    rail.innerHTML = '';

    data.episodes.forEach((ep, i) => {

        pipelineState[i] = 0;

        const card = document.createElement('div');
        card.className = "netflix-card";

        card.innerHTML = `
        <div style="background:#1f1f1f;border-radius:10px;padding:15px;position:relative;">

            <svg class="progress-ring">
                <circle class="bg" cx="23" cy="23" r="20"></circle>
                <circle class="bar" id="bar-${i}" cx="23" cy="23" r="20"></circle>
            </svg>

            <h4>EP ${i+1}</h4>
            <h3>${ep.title}</h3>

            <div class="status" id="status-${i}">Idle</div>

            <button onclick="runStage(${i})">Start</button>
        </div>
        `;

        rail.appendChild(card);
    });
}

/* -----------------------
PROGRESS UPDATE
----------------------- */
function updateProgress(i, val, text) {
    const bar = document.getElementById(`bar-${i}`);
    const status = document.getElementById(`status-${i}`);

    const offset = 126 - (val / 100) * 126;

    bar.style.strokeDashoffset = offset;
    status.innerText = text;
}

/* -----------------------
PIPELINE ENGINE
----------------------- */
async function runStage(i) {
    currentEpisode = i;

    updateProgress(i, 10, "Extracting text...");

    setTimeout(() => {
        updateProgress(i, 30, "Generating script...");

        setTimeout(() => {
            showVoiceModal();
        }, 800);

    }, 800);
}

/* -----------------------
VOICE
----------------------- */
function showVoiceModal() {
    document.getElementById('voiceModal').style.display = 'flex';
}

function confirmVoice() {
    selectedVoice = document.getElementById('voiceSelect').value;

    document.getElementById('voiceModal').style.display = 'none';

    updateProgress(currentEpisode, 50, "Generating audio...");

    generateAudio();
}

async function generateAudio() {
    const ep = currentSeries.episodes[currentEpisode];

    const res = await fetch('/produce-audio', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            script: ep.script,
            episodeId: currentEpisode + 1,
            voice: selectedVoice
        })
    });

    const data = await res.json();

    if (!data.success) {
        updateProgress(currentEpisode, 50, "Audio failed");
        return;
    }

    updateProgress(currentEpisode, 70, "Upload complete");

    audioStore[currentEpisode] = data.audioUrl;

    showAvatarModal();
}

/* -----------------------
AVATAR
----------------------- */
function showAvatarModal() {
    document.getElementById('avatarModal').style.display = 'flex';
}

function confirmAvatar() {
    selectedAvatar = document.getElementById('avatarUrl').value;

    document.getElementById('avatarModal').style.display = 'none';

    updateProgress(currentEpisode, 85, "Generating video...");

    generateVideo();
}

/* -----------------------
VIDEO (D-ID)
----------------------- */
async function generateVideo() {

    const audioUrl = audioStore[currentEpisode];

    const res = await fetch('/generate-video', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            audioUrl,
            imageUrl: selectedAvatar
        })
    });

    const data = await res.json();

    updateProgress(currentEpisode, 100, "Completed");

    showVideo(data.id, data.videoUrl);
}

/* -----------------------
SHOW VIDEO (FIXED)
----------------------- */
function showVideo(id, videoUrl) {
    const rail = document.getElementById('episode-rail');

    const div = document.createElement('div');

    div.innerHTML = `
        <div style="margin-top:20px;background:#1f1f1f;padding:15px;border-radius:10px;">
            <h3>Video Ready</h3>
            <p>ID: ${id || "processing..."}</p>

            ${videoUrl ? `
                <video width="300" controls src="${videoUrl}"></video>
            ` : `
                <p style="color:gray;">Video is processing, ID will be used to fetch later</p>
            `}
        </div>
    `;

    rail.appendChild(div);
}

</script>

</body>
</html>
