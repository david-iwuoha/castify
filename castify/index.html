<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Castify</title>

    <style>
        body {
            background: #121212;
            color: white;
            font-family: sans-serif;
            padding: 40px;
        }

        .rail {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .netflix-card {
            min-width: 280px;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
            background: #2a2a2a;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Castify AI Studio</h1>
    <p>Upload PDF → Generate Episodes → Select Voice → Produce Audio</p>

    <input type="file" id="pdfFile" accept=".pdf">
    <button onclick="testBrain()">Generate Script</button>

    <div id="status" style="margin-top:20px;color:orange;"></div>

    <h3>Output JSON</h3>
    <pre id="output" style="background:#000;padding:15px;border-radius:8px;overflow:auto;"></pre>

    <h2>Episodes</h2>
    <div id="episode-rail" class="rail"></div>

    <script>
        let currentSeries = null;

        // GLOBAL AUDIO STORAGE
        window.audioInstances = {};

        // -----------------------
        // UPLOAD + GENERATE
        // -----------------------
        async function testBrain() {
            const fileInput = document.getElementById('pdfFile');
            const output = document.getElementById('output');
            const status = document.getElementById('status');

            if (!fileInput.files[0]) {
                alert("Please select a PDF first!");
                return;
            }

            status.innerText = "Processing PDF... AI is thinking 🤖";
            output.innerText = "";
            document.getElementById('episode-rail').innerHTML = "";

            const formData = new FormData();
            formData.append('pdf', fileInput.files[0]);

            try {
                const response = await fetch('/process-pdf', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                currentSeries = data;

                output.innerText = JSON.stringify(data, null, 2);

                status.innerText = "Series generated successfully 🎬";

                renderEpisodes(data);

            } catch (err) {
                status.innerText = "Error: " + err.message;
            }
        }

        // -----------------------
        // RENDER EPISODES
        // -----------------------
        function renderEpisodes(data) {
            const rail = document.getElementById('episode-rail');
            rail.innerHTML = '';

            data.episodes.forEach((ep, index) => {

                const card = document.createElement('div');
                card.className = "netflix-card";

                card.innerHTML = `
                    <div style="
                        background:#1f1f1f;
                        border:1px solid #333;
                        border-radius:10px;
                        overflow:hidden;
                        padding:15px;
                    ">

                        <div style="height:120px;background:#333;display:flex;align-items:center;justify-content:center;position:relative;">
                            <span style="font-size:30px;font-weight:bold;">EP ${index + 1}</span>

                            <div style="
                                position:absolute;
                                top:8px;
                                left:8px;
                                background:red;
                                font-size:10px;
                                padding:2px 6px;
                                border-radius:4px;
                            ">
                                READY
                            </div>
                        </div>

                        <h4 style="color:red;font-size:12px;margin-top:10px;">Episode ${index + 1}</h4>

                        <h3 style="margin:5px 0;">${ep.title}</h3>

                        <p style="color:gray;font-size:12px;">
                            "${ep.script.substring(0, 80)}..."
                        </p>

                        <!-- VOICE SELECTOR -->
                        <select id="voice-${index}">
                            <option value="">Select Voice</option>
                            <option value="Idera">Idera</option>
                            <option value="Emma">Emma</option>
                            <option value="Zainab">Zainab</option>
                            <option value="Osagie">Osagie</option>
                            <option value="Wura">Wura</option>
                            <option value="Jude">Jude</option>
                            <option value="Chinenye">Chinenye</option>
                        </select>

                        <button id="btn-${index}"
                            onclick="startProduction(${index})"
                            style="
                                width:100%;
                                padding:10px;
                                margin-top:10px;
                                border:none;
                                border-radius:6px;
                                cursor:pointer;
                                font-weight:bold;
                            ">
                            Generate Episode
                        </button>

                    </div>
                `;

                rail.appendChild(card);
            });
        }

        // -----------------------
        // AUDIO GENERATION + PLAY/PAUSE
        // -----------------------
        async function startProduction(index) {
            const btn = document.getElementById(`btn-${index}`);
            const ep = currentSeries.episodes[index];
            const voiceSelect = document.getElementById(`voice-${index}`);
            const selectedVoice = voiceSelect.value;

            if (!selectedVoice) {
                alert("Please select a voice first.");
                return;
            }

            btn.innerText = "🎤 Generating Voice...";
            btn.disabled = true;

            try {
                const response = await fetch('/produce-audio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        script: ep.script,
                        episodeId: index + 1,
                        voice: selectedVoice
                    })
                });

                const result = await response.json();

                if (result.success) {

                    btn.disabled = false;

                    let audio = window.audioInstances[index];

                    btn.innerText = "▶ Play Audio";

                    btn.onclick = () => {

                        // pause
                        if (audio && !audio.paused) {
                            audio.pause();
                            btn.innerText = "▶ Play Audio";
                            return;
                        }

                        // resume
                        if (audio && audio.paused) {
                            audio.play();
                            btn.innerText = "⏸ Pause Audio";
                            return;
                        }

                        // first play
                        audio = new Audio(result.audioUrl);
                        window.audioInstances[index] = audio;

                        audio.play();
                        btn.innerText = "⏸ Pause Audio";

                        audio.onended = () => {
                            btn.innerText = "▶ Play Audio";
                        };
                    };

                } else {
                    btn.innerText = "Failed";
                    btn.disabled = false;
                }

            } catch (err) {
                btn.innerText = "Error";
                btn.disabled = false;
                console.error(err);
            }
        }
    </script>

</body>
</html>
